version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: halal-tinder-postgres
    environment:
      POSTGRES_DB: halal_tinder
      POSTGRES_USER: halal_tinder
      POSTGRES_PASSWORD: halal_tinder_dev_password
      POSTGRES_INITDB_ARGS: "--encoding=UTF8"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U halal_tinder"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - halal-tinder

  redis:
    image: redis:7-alpine
    container_name: halal-tinder-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - halal-tinder

  api:
    build:
      context: ../..
      dockerfile: infra/docker/api.Dockerfile
    container_name: halal-tinder-api
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://halal_tinder:halal_tinder_dev_password@postgres:5432/halal_tinder
      REDIS_URL: redis://redis:6379
      JWT_SECRET: your-super-secret-jwt-key-change-in-production
      API_PORT: 3000
      API_HOST: 0.0.0.0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ../../:/app
      - /app/node_modules
    command: pnpm dev
    networks:
      - halal-tinder

volumes:
  postgres_data:
  redis_data:

networks:
  halal-tinder:
    driver: bridge
